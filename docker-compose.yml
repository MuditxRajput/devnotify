services:
  notifydev-api:
    build:
      context: ./notifydev-api
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    depends_on:
      - postgres
      - redis
  notifydev-web:
    build:
      context: ./notifydev-web
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    depends_on:
      - notifydev-api
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=notifydev
      - POSTGRES_DB=notifydev
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:latest
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
  worker:
    build:
      context: ./notifydev-api
      dockerfile: Dockerfile
    command: ["node", "src/worker/worker.js"]
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data: